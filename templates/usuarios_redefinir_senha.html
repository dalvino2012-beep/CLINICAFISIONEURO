{% extends "base.html" %}
{% block title %}Redefinir Senha{% endblock %}
{% block content %}
<h1>Redefinir senha</h1>
<p class="muted">Definindo uma nova senha para <strong>{{ usuario.nome }}</strong> ({{ usuario.login }}). Não é preciso saber a senha atual.</p>
<div class="card" style="max-width:420px;">
  <form method="post">
    <div class="form-group">
      <label for="nova_senha">Nova senha</label>
      <input type="password" id="nova_senha" name="nova_senha" required minlength="6" autofocus>
    </div>
    <div class="form-group">
      <label for="confirmar_senha">Confirmar nova senha</label>
      <input type="password" id="confirmar_senha" name="confirmar_senha" required minlength="6">
    </div>
    <button type="submit" class="btn">Salvar</button>
    <a class="btn btn-secondary" href="{{ url_for('usuarios_lista') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
