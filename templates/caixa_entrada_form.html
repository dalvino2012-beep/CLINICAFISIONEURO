{% extends "base.html" %}
{% block title %}Nova Entrada{% endblock %}
{% block content %}
<h1>Nova entrada (Caixa)</h1>
<div class="card">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" value="{{ hoje }}" required>
      </div>
      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input type="text" id="valor" name="valor" inputmode="decimal" placeholder="Ex.: 150,00" required>
      </div>
      <div class="form-group">
        <label for="forma_pagamento">Modalidade de entrada</label>
        <select id="forma_pagamento" name="forma_pagamento">
          {% for fp in formas_pagamento %}
          <option value="{{ fp }}">{{ fp }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" name="descricao" placeholder="Ex.: Venda de produto, aluguel de sala, etc." required>
    </div>
    <button type="submit" class="btn">Salvar</button>
    <a class="btn btn-secondary" href="{{ url_for('caixa') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
