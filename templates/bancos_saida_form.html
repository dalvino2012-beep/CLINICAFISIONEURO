{% extends "base.html" %}
{% block title %}Nova Saída{% endblock %}
{% block content %}
<h1>Nova saída — {{ banco.nome }}{% if banco.codigo %} ({{ banco.codigo }}){% endif %}</h1>
<p class="muted" style="margin-top:-0.6rem;">Registra um valor que saiu diretamente dessa conta (ex.: transferência, pagamento, tarifa).</p>
<div class="card">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" value="{{ hoje }}" required>
      </div>
      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input type="text" id="valor" name="valor" inputmode="decimal" placeholder="Ex.: 150,00" required>
      </div>
    </div>
    <div class="form-group">
      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" name="categoria" list="categorias-saida-banco" placeholder="Ex.: Fornecedor, Tarifa bancária, Imposto">
      <datalist id="categorias-saida-banco">
        <option value="Fornecedor">
        <option value="Tarifa bancária">
        <option value="Imposto">
        <option value="Salários">
        <option value="Outros">
      </datalist>
    </div>
    <div class="form-group">
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" name="descricao" placeholder="Detalhe da saída" required>
    </div>
    <button type="submit" class="btn">Salvar</button>
    <a class="btn btn-secondary" href="{{ url_for('bancos_extrato', banco_id=banco.id) }}">Cancelar</a>
  </form>
</div>
{% endblock %}
